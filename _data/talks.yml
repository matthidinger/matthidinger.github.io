# Talks page data, rendered by _layouts/talks.html.
#
# talks: newest first. date is a quoted "YYYY", "YYYY-MM" or "YYYY-MM-DD"; the log groups by its year.
#   era picks the sky colours (eras below). video is a YouTube id with an optional start in seconds.
#   learn, archive, page, slides, code and post become link pills; post is a path on this site.
#   lost explains a missing recording. Featured talks also need a thumb (pos = 16:9 crop, tall_pos = 3:4 crop)
#   and only featured talks with a YouTube video play in the theater.
# upcoming: tiles drop off once their date has passed.

