# The wiring schematic (stylised, not a wiring guide). Node x/y/w/h are SVG units; `assumed` wires are drawn dashed.
# Coordinates are Blender metres: +X forward, +Y port, +Z up. Part IDs are the model's `part` extras (see _hardware-tools/README.md).
