    - shore-power-inlet
    - ac-panel
    - ac-cable
    - microwave
    - isotemp-water-heater
    - inverter-outlet
    - galley-outlet-shore-only
  both: [ multiplus-inverter-charger ]
mast: [ radar, wind-transducer, radar-cable ]
