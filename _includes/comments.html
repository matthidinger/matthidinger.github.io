{% include base_path %}

<div class="page__comments">
  <h4 class="page__comments-title">{{ site.data.ui-text[site.locale].comments_label }}</h4>
  {% case site.comments.provider %}
  {% when "disqus" %}
    <section id="disqus_thread"></section>
  {% when "custom" %}
    <section id="comments"></section>
  {% endcase %}
</div>
