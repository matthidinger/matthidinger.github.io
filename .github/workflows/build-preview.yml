name: Build preview
run-name: 'Preview PR #${{ github.event.pull_request.number || inputs.pr }} @ ${{ github.event.pull_request.head.sha || inputs.head_sha }}'

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number (same repository)
        required: true
        type: string
      head_sha:
        description: Exact current PR head (40 characters)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  site-acceptance:
    name: site-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      CHROMIUM_PATH: /usr/bin/google-chrome
      PAGES_ENV: dotcom
    steps:
      # Tooling is always approved master code. PR files are staged as data, never checked out here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned acceptance tooling
        run: npm ci --prefix .github/acceptance --ignore-scripts --no-audit --no-fund
      - name: Unit and negative tests
        run: npm --prefix .github/acceptance test
      - name: Stage exact head and merge-base sources
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/acceptance/bin/cloud-build.mjs stage
      - name: Build merge-base with pinned GitHub Pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ${{ steps.stage.outputs.before_dir }}/src
          destination: ${{ steps.stage.outputs.before_dir }}/site
          build_revision: ${{ steps.stage.outputs.baseline_sha }}
          verbose: false
      - name: Build exact head with pinned GitHub Pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ${{ steps.stage.outputs.head_dir }}/src
          destination: ${{ steps.stage.outputs.head_dir }}/site
          build_revision: ${{ env.HEAD_SHA }}
          verbose: false
      - name: Baseline and strict final-head browser acceptance
        run: node .github/acceptance/bin/cloud-build.mjs accept
      - name: Upload accepted data-only candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/cloud/candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Upload before/after evidence even when acceptance fails
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.stage.outputs.head_dir }}/report.json
            ${{ steps.stage.outputs.head_dir }}/report.md
            ${{ steps.stage.outputs.head_dir }}/evidence/
            ${{ steps.stage.outputs.before_dir }}/report.json
            ${{ steps.stage.outputs.before_dir }}/report.md
            ${{ steps.stage.outputs.before_dir }}/evidence/
          retention-days: 7
          if-no-files-found: warn
