name: Build preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Screenshot /talks/
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/scripts/preview-screenshots.js _site shots
      - name: Assemble artifact
        run: |
          mkdir -p preview
          cp -r _site preview/site
          cp -r shots preview/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: preview
          retention-days: 7
