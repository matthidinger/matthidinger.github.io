name: Reconcile previews
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read
  checks: read
concurrency:
  group: reconcile-website-previews
  cancel-in-progress: false

jobs:
  missing-heads:
    if: github.repository == 'matthidinger/matthidinger.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefix .github/acceptance --ignore-scripts --no-audit --no-fund
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/acceptance/bin/cloud-reconcile.mjs
