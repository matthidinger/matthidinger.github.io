name: PR preview build
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - run: bundle exec jekyll build --destination _site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
